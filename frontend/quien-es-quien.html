<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quién es quién · Centro Conectado</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="encabezado">
    <div class="encabezado__fila">
      <a class="volver" href="mas.html" aria-label="Volver">←</a>
      <div class="encabezado__texto">
        <h1>Quién es quién</h1>
        <p class="encabezado__sub">Contactos del Centro y a quién acudir</p>
      </div>
      <a class="campana" href="notificaciones.html" aria-label="Notificaciones">🔔<span class="badge" id="badge-notif" hidden>0</span></a>
    </div>
  </header>

  <main>
    <div class="pestanas" role="tablist" aria-label="Secciones">
      <button role="tab" id="tab-personas" aria-selected="true">Personas</button>
      <button role="tab" id="tab-acudir" aria-selected="false">¿A quién acudo?</button>
      <button role="tab" id="tab-sectores" aria-selected="false">Sectores</button>
    </div>

    <section id="sec-personas">
      <div class="filtros">
        <label class="sr-only" for="q">Buscar por nombre o puesto</label>
        <input type="search" id="q" placeholder="Buscar por nombre o puesto" autocomplete="off">
        <label class="sr-only" for="f-sector">Sector</label>
        <select id="f-sector"><option value="">Todos los sectores</option></select>
      </div>
      <ul class="lista" id="personas" aria-live="polite"><li class="cargando">Cargando…</li></ul>
    </section>

    <section id="sec-acudir" hidden>
      <ul class="lista" id="acudir"><li class="cargando">Cargando…</li></ul>
    </section>

    <section id="sec-sectores" hidden>
      <ul class="lista" id="sectores"><li class="cargando">Cargando…</li></ul>
    </section>
  </main>

  <nav id="barra-inferior" aria-label="Navegación principal"></nav>

  <script src="js/api.js"></script>
  <script src="js/sesion.js"></script>
  <script>
  (function () {
    'use strict';
    Sesion.proteger();
    Sesion.pintarNavegacion('#barra-inferior', 'mas');
    Sesion.iniciarContadorNotificaciones('#badge-notif');
    const { esc } = Sesion;
    const $ = (id) => document.getElementById(id);
    const tel = (t) => esc(String(t).replace(/[^\d+]/g, ''));

    function contacto(c) {
      if (!c) return '';
      const acciones = [
        c.telefono ? `<a class="boton boton--chico" href="tel:${tel(c.telefono)}">📞 Llamar</a>` : '',
        c.telefono ? `<a class="boton boton--secundario boton--chico" href="https://wa.me/${tel(c.telefono).replace('+', '')}" target="_blank" rel="noopener">WhatsApp</a>` : '',
        c.email ? `<a class="boton boton--secundario boton--chico" href="mailto:${esc(c.email)}">✉️ Mail</a>` : '',
      ].join('');
      return `
        <h3>${esc(c.nombre)}</h3>
        <p class="meta">${esc(c.puesto || '')}${c.sector ? ' · ' + esc(c.sector) : ''}${c.interno ? ' · Interno ' + esc(c.interno) : ''}</p>
        ${c.telefono ? `<p class="meta">${esc(c.telefono)}</p>` : ''}
        ${acciones ? `<div class="tarjeta__acciones">${acciones}</div>` : ''}`;
    }

    let temporizador, ultimaBusqueda = 0;
    async function buscar() {
      const n = ++ultimaBusqueda;
      try {
        const res = await CentroAPI.directorio.buscar($('q').value.trim(), $('f-sector').value || undefined);
        if (n !== ultimaBusqueda) return; // llegó una respuesta vieja
        $('personas').innerHTML = res.length
          ? res.map((c) => `<li class="tarjeta">${contacto(c)}</li>`).join('')
          : '<li class="vacio">No encontramos a nadie con esa búsqueda. Probá con otro nombre o sector.</li>';
      } catch (err) {
        $('personas').innerHTML = `<li class="error-caja" role="alert">${esc(err.message)}</li>`;
      }
    }
    $('q').addEventListener('input', () => { clearTimeout(temporizador); temporizador = setTimeout(buscar, 300); });
    $('f-sector').addEventListener('change', buscar);

    ['personas', 'acudir', 'sectores'].forEach((t) => $('tab-' + t).addEventListener('click', () => {
      document.querySelectorAll('[role=tab]').forEach((b) => b.setAttribute('aria-selected', String(b.id === 'tab-' + t)));
      ['personas', 'acudir', 'sectores'].forEach((s) => ($('sec-' + s).hidden = s !== t));
    }));

    CentroAPI.directorio.sectores().then((sectores) => {
      $('f-sector').insertAdjacentHTML('beforeend', sectores.map((s) => `<option value="${s.id}">${esc(s.nombre)}</option>`).join(''));
      $('sectores').innerHTML = sectores.length ? sectores.map((s) => `
        <li class="tarjeta">
          <span class="chip">${s.integrantes} ${s.integrantes === 1 ? 'persona' : 'personas'}</span>
          <h3>${esc(s.nombre)}</h3>
          ${s.descripcion ? `<p>${esc(s.descripcion)}</p>` : ''}
          ${s.referente ? `<p class="meta"><strong>Referente</strong></p>${contacto(s.referente)}` : '<p class="meta">Sin referente asignado</p>'}
        </li>`).join('') : '<li class="vacio">No hay sectores cargados.</li>';
    }).catch((err) => { $('sectores').innerHTML = `<li class="error-caja">${esc(err.message)}</li>`; });

    CentroAPI.directorio.aQuienAcudir().then((temas) => {
      $('acudir').innerHTML = temas.length ? temas.map((a) => `
        <li class="tarjeta">
          <span class="chip">${esc(a.sector ? a.sector.nombre : '')}</span>
          <h3>${esc(a.tema)}</h3>
          ${a.descripcion ? `<p>${esc(a.descripcion)}</p>` : ''}
          ${a.contacto ? `<hr style="border:0;border-top:1px solid var(--pared-2);margin:12px 0">${contacto(a.contacto)}` : ''}
        </li>`).join('') : '<li class="vacio">Todavía no hay temas cargados.</li>';
    }).catch((err) => { $('acudir').innerHTML = `<li class="error-caja">${esc(err.message)}</li>`; });

    buscar();
  })();
  </script>
</body>
</html>
