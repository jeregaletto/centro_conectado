<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedidos · Centro Conectado</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="encabezado">
    <div class="encabezado__fila">
      <div class="encabezado__texto">
        <h1>Pedidos entre áreas</h1>
        <p class="encabezado__sub" id="sector"></p>
      </div>
      <a class="campana" href="notificaciones.html" aria-label="Notificaciones">🔔<span class="badge" id="badge-notif" hidden>0</span></a>
    </div>
  </header>

  <main>
    <details class="plegable" id="nuevo">
      <summary>➕ Nuevo pedido</summary>
      <form class="formulario" id="form-pedido" novalidate>
        <fieldset>
          <legend>¿Qué necesitás?</legend>
          <div class="opciones">
            <label class="opcion"><input type="radio" name="tipo" value="PEDIDO" checked> Pedido</label>
            <label class="opcion"><input type="radio" name="tipo" value="INTERCONSULTA"> Interconsulta</label>
          </div>
        </fieldset>
        <div class="campo">
          <label for="p-destino">¿A qué área?</label>
          <select id="p-destino" name="sectorDestinoId" required><option value="">Cargando áreas…</option></select>
        </div>
        <div class="campo">
          <label for="p-asunto">Asunto</label>
          <input type="text" id="p-asunto" name="asunto" required maxlength="150" placeholder="Ej: Reponer guantes en habitación 12">
        </div>
        <div class="campo">
          <label for="p-detalle">Detalle</label>
          <textarea id="p-detalle" name="detalle" required maxlength="2000"></textarea>
          <p class="aviso-pacientes">⚠️ No escribas nombres ni DNI de pacientes. Usá "habitación 12" o "ver HC".</p>
        </div>
        <div class="campo">
          <label for="p-prioridad">Prioridad</label>
          <select id="p-prioridad" name="prioridad">
            <option value="MEDIA">Normal (72 h)</option>
            <option value="ALTA">Alta (24 h)</option>
            <option value="BAJA">Baja (7 días)</option>
          </select>
        </div>
        <p id="p-error" class="mensaje-error" role="alert" hidden></p>
        <button class="boton boton--ancho" type="submit">Enviar pedido</button>
      </form>
    </details>

    <div class="pestanas" role="tablist" aria-label="Pedidos">
      <button role="tab" id="tab-recibidos" aria-selected="true">Recibidos</button>
      <button role="tab" id="tab-enviados" aria-selected="false">Enviados</button>
      <button role="tab" id="tab-todos" aria-selected="false" hidden>Todos</button>
    </div>
    <div class="campo">
      <label class="sr-only" for="filtro-estado">Filtrar por estado</label>
      <select id="filtro-estado">
        <option value="">Todos los estados</option>
        <option value="PENDIENTE">Pendientes</option>
        <option value="EN_CURSO">En curso</option>
        <option value="RESUELTO">Resueltos</option>
        <option value="RECHAZADO">Rechazados</option>
        <option value="CANCELADO">Cancelados</option>
      </select>
    </div>
    <ul class="lista" id="lista-pedidos" aria-live="polite"><li class="cargando">Cargando…</li></ul>
  </main>

  <nav id="barra-inferior" aria-label="Navegación principal"></nav>

  <script src="js/api.js"></script>
  <script src="js/sesion.js"></script>
  <script>
  (function () {
    'use strict';
    // Las notificaciones viejas apuntan a pedidos.html?id=N: las mandamos al detalle.
    const idNotif = new URLSearchParams(location.search).get('id');
    if (idNotif) { location.replace('pedido.html?id=' + encodeURIComponent(idNotif)); return; }

    const usuario = Sesion.proteger();
    Sesion.pintarNavegacion('#barra-inferior', 'pedidos');
    Sesion.iniciarContadorNotificaciones('#badge-notif');
    const { esc, fmt } = Sesion;
    const $ = (id) => document.getElementById(id);
    const ESTADO = { PENDIENTE: 'Pendiente', EN_CURSO: 'En curso', RESUELTO: 'Resuelto', RECHAZADO: 'Rechazado', CANCELADO: 'Cancelado' };
    const PRIORIDAD = { ALTA: 'Alta', MEDIA: 'Normal', BAJA: 'Baja' };
    let pestana = 'recibidos';

    $('sector').textContent = usuario.sector ? 'Tu área: ' + usuario.sector.nombre : '';
    if (Sesion.tiene(usuario, 'VER_TODOS_LOS_PEDIDOS')) $('tab-todos').hidden = false;

    function plazoTexto(p) {
      if (p.horasRestantes === null) return p.cerradoEn ? `Cerrado el ${fmt.fecha(p.cerradoEn)}` : '';
      if (p.vencido) return `⏰ Vencido hace ${Math.abs(p.horasRestantes)} h`;
      return p.horasRestantes < 24 ? `Vence en ${p.horasRestantes} h` : `Vence el ${fmt.fecha(p.plazo)}`;
    }

    async function cargar() {
      const lista = $('lista-pedidos');
      lista.innerHTML = '<li class="cargando">Cargando…</li>';
      const estado = $('filtro-estado').value || undefined;
      try {
        const pedidos = await CentroAPI.pedidos[pestana](estado);
        const quien = (p) => pestana === 'recibidos' ? `De ${esc(p.sectorOrigen.nombre)}`
          : pestana === 'enviados' ? `Para ${esc(p.sectorDestino.nombre)}`
          : `${esc(p.sectorOrigen.nombre)} → ${esc(p.sectorDestino.nombre)}`;
        lista.innerHTML = pedidos.length ? pedidos.map((p) => `
          <li>
            <a class="tarjeta ${p.vencido ? 'tarjeta--vencida' : ''}" href="pedido.html?id=${p.id}">
              <span class="chip chip--${p.estado.toLowerCase()}">${ESTADO[p.estado]}</span>
              ${p.prioridad === 'ALTA' ? '<span class="chip chip--alta">Prioridad alta</span>' : ''}
              ${p.tipo === 'INTERCONSULTA' ? '<span class="chip">Interconsulta</span>' : ''}
              <h3>${esc(p.asunto)}</h3>
              <p class="meta">${esc(p.codigo)} · ${quien(p)} · ${esc(p.creadoPor)}</p>
              <p class="meta">${plazoTexto(p)}</p>
            </a>
          </li>`).join('')
          : `<li class="vacio">${pestana === 'recibidos' ? 'Tu área no tiene pedidos.'
              : pestana === 'enviados' ? 'Todavía no hiciste pedidos. Tocá "Nuevo pedido" para empezar.'
              : 'No hay pedidos con ese filtro.'}</li>`;
      } catch (err) {
        lista.innerHTML = `<li class="error-caja" role="alert">${esc(err.message)}</li>`;
      }
    }

    ['recibidos', 'enviados', 'todos'].forEach((t) => $('tab-' + t).addEventListener('click', () => {
      pestana = t;
      document.querySelectorAll('[role=tab]').forEach((b) => b.setAttribute('aria-selected', String(b.id === 'tab-' + t)));
      cargar();
    }));
    $('filtro-estado').addEventListener('change', cargar);

    CentroAPI.directorio.sectores().then((sectores) => {
      $('p-destino').innerHTML = '<option value="">Elegí un área</option>' + sectores
        .filter((s) => !usuario.sector || s.id !== usuario.sector.id)
        .map((s) => `<option value="${s.id}">${esc(s.nombre)}</option>`).join('');
    }).catch((err) => { $('p-destino').innerHTML = `<option value="">${esc(err.message)}</option>`; });

    $('form-pedido').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('[type=submit]');
      if (!$('p-destino').value) {
        Sesion.mostrarError($('p-error'), { message: 'Elegí a qué área va el pedido', campos: { sectorDestinoId: 'Elegí un área' } }, form);
        return;
      }
      Sesion.ocupado(btn, true);
      try {
        const res = await CentroAPI.pedidos.crear({
          tipo: form.querySelector('input[name=tipo]:checked').value,
          sectorDestinoId: Number($('p-destino').value),
          asunto: $('p-asunto').value.trim(),
          detalle: $('p-detalle').value.trim(),
          prioridad: $('p-prioridad').value,
        });
        form.reset();
        Sesion.mostrarError($('p-error'), null, form);
        $('nuevo').open = false;
        Sesion.aviso(`Pedido ${res.pedido.codigo} enviado`);
        $('tab-enviados').click();
      } catch (err) {
        Sesion.mostrarError($('p-error'), err, form);
      } finally { Sesion.ocupado(btn, false); }
    });

    cargar();
  })();
  </script>
</body>
</html>
