<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publicar · Centro Conectado</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="encabezado">
    <div class="encabezado__fila">
      <a class="volver" href="mas.html" aria-label="Volver">←</a>
      <div class="encabezado__texto">
        <h1>Publicar</h1>
        <p class="encabezado__sub" id="alcance"></p>
      </div>
      <a class="campana" href="notificaciones.html" aria-label="Notificaciones">🔔<span class="badge" id="badge-notif" hidden>0</span></a>
    </div>
  </header>

  <main>
    <div class="pestanas" role="tablist" aria-label="Qué publicar">
      <button role="tab" id="tab-aviso" aria-selected="true">Aviso</button>
      <button role="tab" id="tab-evento" aria-selected="false">Evento</button>
      <button role="tab" id="tab-mios" aria-selected="false">Publicados</button>
    </div>

    <!-- ===== Aviso ===== -->
    <form class="formulario" id="form-aviso" novalidate>
      <fieldset>
        <legend>Tipo de aviso</legend>
        <div class="opciones">
          <label class="opcion"><input type="radio" name="tipo" value="NOVEDAD" checked> Novedad</label>
          <label class="opcion"><input type="radio" name="tipo" value="CAMBIO_HORARIO"> Cambio de horario</label>
          <label class="opcion"><input type="radio" name="tipo" value="URGENTE"> Urgente</label>
        </div>
        <p class="ayuda">Cambio de horario y Urgente envían una notificación a los destinatarios.</p>
      </fieldset>
      <div class="campo"><label for="a-titulo">Título</label><input type="text" id="a-titulo" name="titulo" required maxlength="150"></div>
      <div class="campo"><label for="a-cuerpo">Texto</label><textarea id="a-cuerpo" name="cuerpo" required maxlength="4000"></textarea></div>
      <div class="campo">
        <label class="opcion"><input type="checkbox" id="a-fijado" name="fijado"> 📌 Fijar arriba en Inicio</label>
      </div>
      <div class="campo">
        <label class="opcion"><input type="checkbox" id="a-lectura" name="requiereLectura"> Pedir confirmación de lectura</label>
      </div>
      <div class="campo">
        <label for="a-vigencia">Vigente hasta</label>
        <input type="date" id="a-vigencia" name="vigenteHasta">
        <p class="ayuda">Si lo dejás vacío vence a los 30 días. Máximo 180 días.</p>
      </div>
      <fieldset class="destinos">
        <legend>¿Para quién?</legend>
        <div class="opciones" data-destinos></div>
      </fieldset>
      <p id="a-error" class="mensaje-error" role="alert" hidden></p>
      <button class="boton boton--ancho" type="submit">Publicar aviso</button>
    </form>

    <!-- ===== Evento ===== -->
    <form class="formulario" id="form-evento" novalidate hidden>
      <fieldset>
        <legend>Tipo de evento</legend>
        <div class="opciones">
          <label class="opcion"><input type="radio" name="tipo" value="EVENTO" checked> Evento</label>
          <label class="opcion"><input type="radio" name="tipo" value="CAPACITACION"> Capacitación</label>
          <label class="opcion"><input type="radio" name="tipo" value="REUNION"> Reunión</label>
        </div>
      </fieldset>
      <div class="campo"><label for="e-titulo">Título</label><input type="text" id="e-titulo" name="titulo" required maxlength="150"></div>
      <div class="campo"><label for="e-descripcion">Descripción</label><textarea id="e-descripcion" name="descripcion" maxlength="2000"></textarea></div>
      <div class="campo"><label for="e-lugar">Lugar</label><input type="text" id="e-lugar" name="lugar" maxlength="150" placeholder="Ej: Sala de reuniones, 1er piso"></div>
      <div class="fila">
        <div class="campo"><label for="e-inicio">Empieza</label><input type="datetime-local" id="e-inicio" name="inicio" required></div>
        <div class="campo"><label for="e-fin">Termina</label><input type="datetime-local" id="e-fin" name="fin" required></div>
      </div>
      <div class="campo">
        <label for="e-recordatorio">Recordatorio</label>
        <select id="e-recordatorio" name="recordatorioMinutos">
          <option value="">Sin recordatorio</option>
          <option value="30">30 minutos antes</option>
          <option value="60" selected>1 hora antes</option>
          <option value="1440">1 día antes</option>
        </select>
      </div>
      <fieldset class="destinos">
        <legend>¿Para quién?</legend>
        <div class="opciones" data-destinos></div>
      </fieldset>
      <p id="e-error" class="mensaje-error" role="alert" hidden></p>
      <button class="boton boton--ancho" type="submit">Publicar evento</button>
    </form>

    <!-- ===== Publicados ===== -->
    <section id="sec-mios" hidden>
      <h2>Por vencer</h2>
      <ul class="lista" id="por-vencer"><li class="cargando">Cargando…</li></ul>
      <h2>Avisos vigentes</h2>
      <ul class="lista" id="vigentes"><li class="cargando">Cargando…</li></ul>
    </section>
  </main>

  <nav id="barra-inferior" aria-label="Navegación principal"></nav>

  <script src="js/api.js"></script>
  <script src="js/sesion.js"></script>
  <script>
  (function () {
    'use strict';
    const usuario = Sesion.proteger();
    const general = Sesion.tiene(usuario, 'PUBLICAR_GENERAL');
    if (!general && !Sesion.tiene(usuario, 'PUBLICAR_SECTOR')) { location.replace('inicio.html'); return; }
    Sesion.pintarNavegacion('#barra-inferior', 'mas');
    Sesion.iniciarContadorNotificaciones('#badge-notif');
    const { esc, fmt } = Sesion;
    const $ = (id) => document.getElementById(id);
    const TIPO = { NOVEDAD: 'Novedad', CAMBIO_HORARIO: 'Cambio de horario', URGENTE: 'Urgente' };
    const nombreCompleto = `${usuario.nombre} ${usuario.apellido}`;
    const verLecturas = Sesion.tiene(usuario, 'VER_LECTURAS');

    $('alcance').textContent = general ? 'Podés publicar para todo el Centro o para sectores'
      : `Como referente publicás para ${usuario.sector.nombre}`;

    // ----- destinatarios -----
    if (general) {
      CentroAPI.directorio.sectores().then((sectores) => {
        document.querySelectorAll('[data-destinos]').forEach((cont) => {
          cont.innerHTML = '<p class="ayuda" style="width:100%;margin:0">Sin marcar ninguno = todo el Centro.</p>' +
            sectores.map((s) => `<label class="opcion"><input type="checkbox" value="${s.id}"> ${esc(s.nombre)}</label>`).join('');
        });
      }).catch(() => {});
    } else {
      document.querySelectorAll('[data-destinos]').forEach((cont) => {
        cont.innerHTML = `<label class="opcion"><input type="checkbox" value="${usuario.sector.id}" checked disabled> ${esc(usuario.sector.nombre)}</label>`;
      });
    }
    const sectoresElegidos = (form) => [...form.querySelectorAll('[data-destinos] input:checked')].map((i) => Number(i.value));

    // ----- pestañas -----
    function mostrar(t) {
      document.querySelectorAll('[role=tab]').forEach((b) => b.setAttribute('aria-selected', String(b.id === 'tab-' + t)));
      $('form-aviso').hidden = t !== 'aviso';
      $('form-evento').hidden = t !== 'evento';
      $('sec-mios').hidden = t !== 'mios';
      if (t === 'mios') cargarPublicados();
    }
    ['aviso', 'evento', 'mios'].forEach((t) => $('tab-' + t).addEventListener('click', () => mostrar(t)));

    // ----- publicar aviso -----
    $('form-aviso').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('[type=submit]');
      Sesion.ocupado(btn, true);
      try {
        await CentroAPI.avisos.crear({
          titulo: $('a-titulo').value.trim(),
          cuerpo: $('a-cuerpo').value.trim(),
          tipo: form.querySelector('input[name=tipo]:checked').value,
          fijado: $('a-fijado').checked,
          requiereLectura: $('a-lectura').checked,
          vigenteHasta: $('a-vigencia').value ? $('a-vigencia').value + 'T23:59:00' : null,
          sectorIds: sectoresElegidos(form),
        });
        form.reset();
        Sesion.mostrarError($('a-error'), null, form);
        Sesion.aviso('Aviso publicado');
        mostrar('mios');
      } catch (err) {
        Sesion.mostrarError($('a-error'), err, form);
      } finally { Sesion.ocupado(btn, false); }
    });

    // ----- publicar evento -----
    $('e-inicio').addEventListener('change', () => {
      if (!$('e-inicio').value) return;
      const fin = new Date($('e-inicio').value); fin.setHours(fin.getHours() + 1);
      if (!$('e-fin').value || $('e-fin').value <= $('e-inicio').value) {
        $('e-fin').value = `${fmt.isoDia(fin)}T${String(fin.getHours()).padStart(2, '0')}:${String(fin.getMinutes()).padStart(2, '0')}`;
      }
    });

    $('form-evento').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('[type=submit]');
      if ($('e-inicio').value && $('e-fin').value && $('e-fin').value <= $('e-inicio').value) {
        Sesion.mostrarError($('e-error'), { message: 'El evento tiene que terminar después de empezar', campos: { fin: 'Revisá la hora de fin' } }, form);
        return;
      }
      Sesion.ocupado(btn, true);
      try {
        const ev = await CentroAPI.agenda.crear({
          titulo: $('e-titulo').value.trim(),
          descripcion: $('e-descripcion').value.trim() || null,
          tipo: form.querySelector('input[name=tipo]:checked').value,
          lugar: $('e-lugar').value.trim() || null,
          inicio: $('e-inicio').value || null,
          fin: $('e-fin').value || null,
          recordatorioMinutos: $('e-recordatorio').value ? Number($('e-recordatorio').value) : null,
          sectorIds: sectoresElegidos(form),
        });
        form.reset();
        Sesion.mostrarError($('e-error'), null, form);
        location.href = 'agenda.html?evento=' + ev.id;
      } catch (err) {
        Sesion.mostrarError($('e-error'), err, form);
      } finally { Sesion.ocupado(btn, false); }
    });

    // ----- publicados: lecturas, renovar, quitar -----
    function itemAviso(a) {
      return `
        <li class="tarjeta tarjeta--${a.tipo.toLowerCase()}" data-aviso="${a.id}">
          <span class="chip chip--${a.tipo.toLowerCase()}">${TIPO[a.tipo]}</span>
          ${a.fijado ? '<span class="chip">📌 Fijado</span>' : ''}
          ${a.porVencer ? '<span class="chip chip--por-vencer">Vence pronto</span>' : ''}
          <h3>${esc(a.titulo)}</h3>
          <p class="meta">${esc(a.autor)} · Publicado ${fmt.fecha(a.publicadoEn)} · Vence ${fmt.fecha(a.vigenteHasta)}</p>
          <p class="meta">${a.sectores.length ? 'Para ' + esc(a.sectores.join(', ')) : 'Para todo el Centro'}</p>
          <div class="lecturas"></div>
          <div class="tarjeta__acciones">
            ${verLecturas && a.requiereLectura ? `<button class="boton boton--secundario boton--chico" type="button" data-accion="lecturas">👁 Quién leyó</button>` : ''}
            <button class="boton boton--secundario boton--chico" type="button" data-accion="renovar">Renovar 30 días</button>
            <button class="boton boton--peligro boton--chico" type="button" data-accion="quitar">Quitar</button>
          </div>
        </li>`;
    }

    async function cargarPublicados() {
      try {
        const [porVencer, vigentes] = await Promise.all([CentroAPI.avisos.porVencer(), CentroAPI.avisos.listar()]);
        const mios = general ? vigentes : vigentes.filter((a) => a.autor === nombreCompleto);
        $('por-vencer').innerHTML = porVencer.length ? porVencer.map(itemAviso).join('')
          : '<li class="vacio">Nada por vencer en los próximos días.</li>';
        $('vigentes').innerHTML = mios.length ? mios.map(itemAviso).join('')
          : '<li class="vacio">Todavía no publicaste avisos. Usá la pestaña Aviso para empezar.</li>';
      } catch (err) {
        $('por-vencer').innerHTML = `<li class="error-caja" role="alert">${esc(err.message)}</li>`;
        $('vigentes').innerHTML = '';
      }
    }

    $('sec-mios').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-accion]');
      if (!btn) return;
      const li = btn.closest('[data-aviso]');
      const id = li.dataset.aviso;
      const accion = btn.dataset.accion;
      if (accion === 'quitar' && btn.dataset.confirmar !== '1') {
        btn.dataset.confirmar = '1'; btn.textContent = '¿Seguro? Tocá de nuevo'; return;
      }
      Sesion.ocupado(btn, true);
      try {
        if (accion === 'lecturas') {
          const l = await CentroAPI.avisos.lecturas(id);
          li.querySelector('.lecturas').innerHTML = `
            <div class="avance" style="padding:10px 0 0;margin:0">
              <p class="meta"><strong>Leyeron ${l.leyeron} de ${l.destinatarios} (${l.porcentaje}%)</strong></p>
              <div class="avance__barra"><div class="avance__relleno" style="width:${l.porcentaje}%"></div></div>
              ${l.pendientes.length ? `<p class="meta">Falta: ${l.pendientes.map((p) => esc(p.nombre)).join(', ')}</p>` : '<p class="meta">Lo leyeron todos ✔</p>'}
            </div>`;
          Sesion.ocupado(btn, false);
        } else if (accion === 'renovar') {
          await CentroAPI.avisos.renovar(id);
          Sesion.aviso('Aviso renovado');
          cargarPublicados();
        } else {
          await CentroAPI.avisos.eliminar(id);
          Sesion.aviso('Aviso quitado');
          cargarPublicados();
        }
      } catch (err) {
        Sesion.ocupado(btn, false);
        Sesion.aviso(err.message, 'error');
      }
    });

    const inicial = new URLSearchParams(location.search).get('tipo');
    mostrar(['aviso', 'evento', 'mios'].includes(inicial) ? inicial : 'aviso');
  })();
  </script>
</body>
</html>
