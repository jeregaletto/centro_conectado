<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi puesto · Centro Conectado</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    .tarea button {
      display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
      width: 100%; min-height: 72px; padding: 12px 16px; margin-bottom: 10px;
      background: var(--papel); border: 3px solid var(--pared-2); border-radius: var(--radio);
      font: inherit; color: inherit; text-align: left; cursor: pointer;
    }
    [data-vista="SIMPLE"] .tarea button { min-height: 92px; }
    .tarea__icono { font-size: 34px; line-height: 1; }
    [data-vista="SIMPLE"] .tarea__icono { font-size: 44px; }
    .tarea__titulo { display: block; font-weight: 700; }
    .tarea__ayuda { display: block; font-size: 15px; color: var(--tinta-suave); }
    .tarea__check {
      width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--borde);
      display: grid; place-items: center; font-size: 22px; color: #fff;
    }
    .tarea--hecha button { border-color: var(--ok); background: #E3F4EF; }
    .tarea--hecha .tarea__titulo { text-decoration: line-through; }
    .tarea--hecha .tarea__check { background: var(--ok); border-color: var(--ok); }
    .tarea--hecha .tarea__check::before { content: "✓"; }
  </style>
</head>
<body>
  <header class="encabezado">
    <div class="encabezado__fila">
      <div class="encabezado__texto">
        <h1>Mi puesto</h1>
        <p class="encabezado__sub" id="puesto"></p>
      </div>
      <a class="campana" href="notificaciones.html" aria-label="Notificaciones">🔔<span class="badge" id="badge-notif" hidden>0</span></a>
    </div>
  </header>

  <main>
    <div id="error" class="error-caja" role="alert" hidden></div>
    <section class="avance" aria-live="polite">
      <p class="avance__texto" id="avance-texto">Cargando…</p>
      <div class="avance__barra"><div class="avance__relleno" id="avance-barra"></div></div>
    </section>

    <h2>Tareas de hoy</h2>
    <ul class="lista" id="tareas"></ul>

    <section id="referente"></section>
    <section id="protocolos"></section>
  </main>

  <nav id="barra-inferior" aria-label="Navegación principal"></nav>

  <script src="js/api.js"></script>
  <script src="js/sesion.js"></script>
  <script>
  (function () {
    'use strict';
    const usuario = Sesion.proteger();
    Sesion.pintarNavegacion('#barra-inferior', usuario.vista === 'SIMPLE' ? 'miPuesto' : 'mas');
    Sesion.iniciarContadorNotificaciones('#badge-notif');
    const { esc, fmt } = Sesion;
    const $ = (id) => document.getElementById(id);
    const ICONOS = { banio: '🚻', basura: '🗑️', trapeador: '🧽', silla: '🪑', jabon: '🧴', ventana: '🪟', caja: '📦',
                     carro: '🛒', termometro: '🌡️', pastilla: '💊' };

    function pintar(mp) {
      $('puesto').textContent = [mp.puesto, mp.sector, fmt.fechaLarga(mp.fecha)].filter(Boolean).join(' · ');
      const a = mp.avance;
      $('avance-texto').textContent = a.total === 0 ? 'No tenés tareas asignadas'
        : a.hechas === a.total ? `¡Listo! Hiciste las ${a.total} tareas` : `Hiciste ${a.hechas} de ${a.total}`;
      $('avance-barra').style.width = a.porcentaje + '%';

      $('tareas').innerHTML = mp.tareas.length ? mp.tareas.map((t) => `
        <li class="tarea ${t.completada ? 'tarea--hecha' : ''}">
          <button type="button" data-tarea="${t.id}" data-hecha="${t.completada}" aria-pressed="${t.completada}">
            <span class="tarea__icono" aria-hidden="true">${ICONOS[t.icono] || '✔️'}</span>
            <span>
              <span class="tarea__titulo">${esc(t.titulo)}</span>
              ${t.descripcion ? `<span class="tarea__ayuda">${esc(t.descripcion)}</span>` : ''}
              ${t.frecuencia === 'SEMANAL' ? '<span class="chip">Esta semana</span>' : ''}
              ${t.completada && t.completadaEn ? `<span class="tarea__ayuda">Hecha a las ${fmt.hora(t.completadaEn)}</span>` : ''}
            </span>
            <span class="tarea__check" aria-hidden="true"></span>
          </button>
        </li>`).join('')
        : '<li class="vacio">Tu sector todavía no cargó tareas para tu puesto. Consultá a tu referente.</li>';

      const r = mp.referente;
      $('referente').innerHTML = r ? `
        <h2>¿Dudas? Tu referente</h2>
        <div class="tarjeta">
          <h3>${esc(r.nombre)}</h3>
          <p class="meta">${esc(r.puesto || '')}${r.interno ? ' · Interno ' + esc(r.interno) : ''}</p>
          ${r.telefono ? `<div class="tarjeta__acciones"><a class="boton" href="tel:${esc(r.telefono.replace(/\s/g, ''))}">📞 Llamar</a></div>` : ''}
        </div>` : '';

      $('protocolos').innerHTML = mp.protocolos && mp.protocolos.length ? `
        <h2>Protocolos de tu sector</h2>
        ${mp.protocolos.map((p) => `<a class="tarjeta" href="${esc(p.url)}" target="_blank" rel="noopener">📄 ${esc(p.titulo)}</a>`).join('')}` : '';
    }

    $('tareas').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-tarea]');
      if (!btn || btn.disabled) return;
      Sesion.ocupado(btn, true);
      try {
        const id = btn.dataset.tarea;
        const mp = btn.dataset.hecha === 'true'
          ? await CentroAPI.miPuesto.desmarcar(id)
          : await CentroAPI.miPuesto.completar(id);
        pintar(mp);
      } catch (err) {
        Sesion.ocupado(btn, false);
        Sesion.aviso(err.message, 'error');
      }
    });

    CentroAPI.miPuesto.obtener().then(pintar).catch((err) => {
      $('avance-texto').textContent = '';
      $('error').hidden = false;
      $('error').textContent = err.message;
    });
  })();
  </script>
</body>
</html>
