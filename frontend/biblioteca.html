<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca · Centro Conectado</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="encabezado">
    <div class="encabezado__fila">
      <a class="volver" href="mas.html" aria-label="Volver">←</a>
      <div class="encabezado__texto">
        <h1>Biblioteca</h1>
        <p class="encabezado__sub">Protocolos, manuales y documentos vigentes</p>
      </div>
      <a class="campana" href="notificaciones.html" aria-label="Notificaciones">🔔<span class="badge" id="badge-notif" hidden>0</span></a>
    </div>
  </header>

  <main>
    <details class="plegable" id="nuevo" hidden>
      <summary>➕ Agregar documento</summary>
      <form class="formulario" id="form-doc" novalidate>
        <div class="campo"><label for="d-titulo">Título</label><input type="text" id="d-titulo" name="titulo" required maxlength="150"></div>
        <div class="campo"><label for="d-descripcion">Descripción</label><textarea id="d-descripcion" name="descripcion" maxlength="500" style="min-height:70px"></textarea></div>
        <div class="fila">
          <div class="campo"><label for="d-categoria">Categoría</label><select id="d-categoria" name="categoria"></select></div>
          <div class="campo"><label for="d-sector">Sector</label><select id="d-sector" name="sectorId"><option value="">Todo el Centro</option></select></div>
        </div>
        <div class="campo">
          <label for="d-url">Enlace al documento</label>
          <input type="url" id="d-url" name="url" required maxlength="500" placeholder="https://drive.google.com/...">
          <p class="ayuda">Tiene que empezar con https:// (por ahora no se suben archivos, se guarda el enlace).</p>
        </div>
        <div class="fila">
          <div class="campo"><label for="d-version">Versión</label><input type="text" id="d-version" name="version" maxlength="20" placeholder="v1"></div>
          <div class="campo"><label for="d-vigencia">Vigente hasta</label><input type="date" id="d-vigencia" name="vigenteHasta"><p class="ayuda">Vacío = 30 días. Máximo 180.</p></div>
        </div>
        <p id="d-error" class="mensaje-error" role="alert" hidden></p>
        <button class="boton boton--ancho" type="submit">Publicar documento</button>
      </form>
    </details>

    <div class="filtros">
      <label class="sr-only" for="q">Buscar</label>
      <input type="search" id="q" placeholder="Buscar documento" autocomplete="off">
      <label class="sr-only" for="f-categoria">Categoría</label>
      <select id="f-categoria"><option value="">Todas las categorías</option></select>
    </div>
    <ul class="lista" id="docs" aria-live="polite"><li class="cargando">Cargando…</li></ul>
  </main>

  <nav id="barra-inferior" aria-label="Navegación principal"></nav>

  <script src="js/api.js"></script>
  <script src="js/sesion.js"></script>
  <script>
  (function () {
    'use strict';
    const usuario = Sesion.proteger();
    Sesion.pintarNavegacion('#barra-inferior', 'mas');
    Sesion.iniciarContadorNotificaciones('#badge-notif');
    const { esc, fmt } = Sesion;
    const $ = (id) => document.getElementById(id);
    const CATEGORIA = { PROTOCOLO: 'Protocolos', MANUAL_INDUCCION: 'Manual de inducción', REGLAMENTO: 'Reglamentos',
                        INSTITUCIONAL: 'Institucional', KIT_BIENVENIDA: 'Kit de bienvenida' };
    const gestiona = Sesion.tiene(usuario, 'GESTIONAR_BIBLIOTECA');
    const resaltado = new URLSearchParams(location.search).get('id');
    const opcionesCategoria = Object.entries(CATEGORIA).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
    $('f-categoria').insertAdjacentHTML('beforeend', opcionesCategoria);
    $('d-categoria').innerHTML = opcionesCategoria;

    function pintarDoc(d) {
      return `
        <li class="tarjeta ${d.porVencer ? 'tarjeta--cambio_horario' : ''} ${String(d.id) === resaltado ? 'tarjeta--destacada' : ''}" id="doc-${d.id}">
          <span class="chip">${CATEGORIA[d.categoria] || esc(d.categoria)}</span>
          ${d.version ? `<span class="chip">${esc(d.version)}</span>` : ''}
          ${d.porVencer && gestiona ? '<span class="chip chip--por-vencer">Por vencer</span>' : ''}
          <h3>${esc(d.titulo)}</h3>
          ${d.descripcion ? `<p>${esc(d.descripcion)}</p>` : ''}
          <p class="meta">${d.sector ? esc(d.sector.nombre) : 'Todo el Centro'} · Publicó ${esc(d.publicadoPor)} · ${fmt.fecha(d.publicadoEn)}
            ${gestiona ? ' · Vigente hasta ' + fmt.fecha(d.vigenteHasta) : ''}</p>
          <div class="tarjeta__acciones">
            <a class="boton boton--chico" href="${esc(d.url)}" target="_blank" rel="noopener">📄 Abrir</a>
            ${gestiona ? `<button class="boton boton--secundario boton--chico" type="button" data-renovar="${d.id}">Renovar 30 días</button>
                          <button class="boton boton--peligro boton--chico" type="button" data-eliminar="${d.id}">Quitar</button>` : ''}
          </div>
        </li>`;
    }

    let temporizador, ultima = 0;
    async function cargar() {
      const n = ++ultima;
      try {
        const docs = await CentroAPI.biblioteca.listar({ q: $('q').value.trim(), categoria: $('f-categoria').value });
        if (n !== ultima) return;
        $('docs').innerHTML = docs.length ? docs.map(pintarDoc).join('')
          : '<li class="vacio">No hay documentos con esa búsqueda.</li>';
        if (resaltado && $('doc-' + resaltado)) $('doc-' + resaltado).scrollIntoView({ block: 'center' });
      } catch (err) {
        $('docs').innerHTML = `<li class="error-caja" role="alert">${esc(err.message)}</li>`;
      }
    }
    $('q').addEventListener('input', () => { clearTimeout(temporizador); temporizador = setTimeout(cargar, 300); });
    $('f-categoria').addEventListener('change', cargar);

    if (gestiona) {
      $('nuevo').hidden = false;
      CentroAPI.directorio.sectores().then((s) => $('d-sector').insertAdjacentHTML('beforeend',
        s.map((x) => `<option value="${x.id}">${esc(x.nombre)}</option>`).join(''))).catch(() => {});

      $('form-doc').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const btn = form.querySelector('[type=submit]');
        Sesion.ocupado(btn, true);
        try {
          await CentroAPI.biblioteca.crear({
            titulo: $('d-titulo').value.trim(),
            descripcion: $('d-descripcion').value.trim() || null,
            categoria: $('d-categoria').value,
            url: $('d-url').value.trim(),
            sectorId: $('d-sector').value ? Number($('d-sector').value) : null,
            version: $('d-version').value.trim() || null,
            vigenteHasta: $('d-vigencia').value ? $('d-vigencia').value + 'T23:59:00' : null,
          });
          form.reset();
          Sesion.mostrarError($('d-error'), null, form);
          $('nuevo').open = false;
          Sesion.aviso('Documento publicado');
          cargar();
        } catch (err) {
          Sesion.mostrarError($('d-error'), err, form);
        } finally { Sesion.ocupado(btn, false); }
      });

      $('docs').addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-renovar],[data-eliminar]');
        if (!btn) return;
        if (btn.dataset.eliminar && btn.dataset.confirmar !== '1') {
          btn.dataset.confirmar = '1';
          btn.textContent = '¿Seguro? Tocá de nuevo';
          return;
        }
        Sesion.ocupado(btn, true);
        try {
          if (btn.dataset.renovar) { await CentroAPI.biblioteca.renovar(btn.dataset.renovar); Sesion.aviso('Vigencia renovada'); }
          else { await CentroAPI.biblioteca.eliminar(btn.dataset.eliminar); Sesion.aviso('Documento quitado'); }
          cargar();
        } catch (err) {
          Sesion.ocupado(btn, false);
          Sesion.aviso(err.message, 'error');
        }
      });
    }

    cargar();
  })();
  </script>
</body>
</html>
