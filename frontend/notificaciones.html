<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notificaciones · Centro Conectado</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    .notif { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; border-top: 0; border-right: 0; border-bottom: 0; }
    .notif--nueva { border-left-color: var(--senal); font-weight: 400; }
    .notif--nueva h3::before { content: "● "; color: var(--alerta); }
  </style>
</head>
<body>
  <header class="encabezado">
    <div class="encabezado__fila">
      <a class="volver" href="inicio.html" aria-label="Volver al inicio">←</a>
      <div class="encabezado__texto">
        <h1>Notificaciones</h1>
      </div>
    </div>
  </header>

  <main>
    <div class="tarjeta__acciones" style="margin:0 0 14px">
      <button class="boton boton--secundario boton--chico" type="button" id="btn-todas">✔ Marcar todas como leídas</button>
      <label class="opcion"><input type="checkbox" id="solo-nuevas"> Solo sin leer</label>
    </div>
    <ul class="lista" id="lista" aria-live="polite"><li class="cargando">Cargando…</li></ul>
  </main>

  <nav id="barra-inferior" aria-label="Navegación principal"></nav>

  <script src="js/api.js"></script>
  <script src="js/sesion.js"></script>
  <script>
  (function () {
    'use strict';
    Sesion.proteger();
    Sesion.pintarNavegacion('#barra-inferior', '');
    const { esc, fmt } = Sesion;
    const $ = (id) => document.getElementById(id);
    // Solo seguimos links internos (ej: "pedidos.html?id=3"), nunca a otro sitio.
    const linkSeguro = (l) => l && /^[\w\-]+\.html(\?[\w\-=&%.]*)?$/.test(l) ? l : null;

    async function cargar() {
      try {
        const lista = await CentroAPI.notificaciones.listar($('solo-nuevas').checked);
        $('lista').innerHTML = lista.length ? lista.map((n) => `
          <li><button type="button" class="tarjeta notif ${n.leida ? '' : 'notif--nueva'}" data-id="${n.id}" data-link="${esc(linkSeguro(n.link) || '')}" data-leida="${n.leida}">
            <h3>${esc(n.titulo)}</h3>
            ${n.mensaje ? `<p class="texto-largo">${esc(n.mensaje)}</p>` : ''}
            <p class="meta">${fmt.fechaHora(n.creadaEn)}${linkSeguro(n.link) ? ' · Tocá para ver' : ''}</p>
          </button></li>`).join('')
          : '<li class="vacio">No tenés notificaciones.</li>';
      } catch (err) {
        $('lista').innerHTML = `<li class="error-caja" role="alert">${esc(err.message)}</li>`;
      }
    }

    $('lista').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-id]');
      if (!btn) return;
      if (btn.dataset.leida !== 'true') {
        try { await CentroAPI.notificaciones.marcarLeida(btn.dataset.id); } catch (_) { /* seguimos igual */ }
      }
      if (btn.dataset.link) location.href = btn.dataset.link;
      else cargar();
    });

    $('btn-todas').addEventListener('click', async (e) => {
      Sesion.ocupado(e.currentTarget, true);
      try { await CentroAPI.notificaciones.leerTodas(); Sesion.aviso('Listo'); cargar(); }
      catch (err) { Sesion.aviso(err.message, 'error'); }
      finally { Sesion.ocupado($('btn-todas'), false); }
    });
    $('solo-nuevas').addEventListener('change', cargar);

    cargar();
  })();
  </script>
</body>
</html>
