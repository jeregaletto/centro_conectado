<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda · Centro Conectado</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="encabezado">
    <div class="encabezado__fila">
      <div class="encabezado__texto">
        <h1>Agenda</h1>
        <p class="encabezado__sub" id="rango"></p>
      </div>
      <a class="campana" href="notificaciones.html" aria-label="Notificaciones">🔔<span class="badge" id="badge-notif" hidden>0</span></a>
    </div>
  </header>

  <main>
    <div class="tarjeta__acciones" style="margin:0 0 14px">
      <button class="boton boton--secundario boton--chico" type="button" id="btn-anterior">← Semana anterior</button>
      <button class="boton boton--secundario boton--chico" type="button" id="btn-hoy">Hoy</button>
      <button class="boton boton--secundario boton--chico" type="button" id="btn-siguiente">Semana siguiente →</button>
      <a class="boton boton--chico" href="publicar.html?tipo=evento" id="btn-nuevo" hidden>+ Nuevo evento</a>
    </div>
    <div id="error" class="error-caja" role="alert" hidden></div>
    <div id="dias" aria-live="polite"><p class="cargando">Cargando…</p></div>
  </main>

  <nav id="barra-inferior" aria-label="Navegación principal"></nav>

  <script src="js/api.js"></script>
  <script src="js/sesion.js"></script>
  <script>
  (function () {
    'use strict';
    const usuario = Sesion.proteger();
    Sesion.pintarNavegacion('#barra-inferior', 'agenda');
    Sesion.iniciarContadorNotificaciones('#badge-notif');
    const { esc, fmt } = Sesion;
    const $ = (id) => document.getElementById(id);
    const TIPO = { EVENTO: 'Evento', CAPACITACION: 'Capacitación', REUNION: 'Reunión' };
    const eventoResaltado = new URLSearchParams(location.search).get('evento');
    const puedePublicar = Sesion.tiene(usuario, 'PUBLICAR_GENERAL') || Sesion.tiene(usuario, 'PUBLICAR_SECTOR');
    $('btn-nuevo').hidden = !puedePublicar;

    let desde = new Date(); desde.setHours(0, 0, 0, 0);
    const sumarDias = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };

    function pintarEvento(e) {
      const mismoDia = e.inicio.slice(0, 10) === e.fin.slice(0, 10);
      return `
        <article class="tarjeta ${String(e.id) === eventoResaltado ? 'tarjeta--destacada' : ''}" id="evento-${e.id}">
          <span class="chip">${TIPO[e.tipo] || esc(e.tipo)}</span>
          <h3>${fmt.hora(e.inicio)} a ${mismoDia ? fmt.hora(e.fin) : fmt.fechaHora(e.fin)} · ${esc(e.titulo)}</h3>
          ${e.lugar ? `<p class="meta">📍 ${esc(e.lugar)}</p>` : ''}
          ${e.descripcion ? `<p class="texto-largo">${esc(e.descripcion)}</p>` : ''}
          <p class="meta">${e.sectores.length ? 'Para ' + esc(e.sectores.join(', ')) : 'Para todo el Centro'} · Publicó ${esc(e.autor)}</p>
          <div class="tarjeta__acciones">
            <button class="boton boton--secundario boton--chico" type="button" data-ics="${e.id}">📲 Agregar a mi calendario</button>
          </div>
        </article>`;
    }

    async function cargar() {
      const hasta = sumarDias(desde, 6);
      $('rango').textContent = `Del ${fmt.fecha(fmt.isoDia(desde))} al ${fmt.fecha(fmt.isoDia(hasta))}`;
      $('error').hidden = true;
      $('dias').innerHTML = '<p class="cargando">Cargando…</p>';
      try {
        const eventos = await CentroAPI.agenda.listar(fmt.isoDia(desde), fmt.isoDia(hasta));
        if (!eventos.length) {
          $('dias').innerHTML = '<p class="vacio">No hay eventos esta semana. Probá con la semana siguiente.</p>';
          return;
        }
        const porDia = {};
        eventos.forEach((e) => (porDia[e.inicio.slice(0, 10)] ||= []).push(e));
        $('dias').innerHTML = Object.keys(porDia).sort().map((dia) => `
          <h2 style="text-transform:capitalize">${dia === fmt.isoDia(new Date()) ? 'Hoy, ' : ''}${fmt.fechaLarga(dia)}</h2>
          ${porDia[dia].map(pintarEvento).join('')}`).join('');
        if (eventoResaltado && $('evento-' + eventoResaltado)) $('evento-' + eventoResaltado).scrollIntoView({ block: 'center' });
      } catch (err) {
        $('dias').innerHTML = '';
        $('error').hidden = false;
        $('error').textContent = err.message;
      }
    }

    $('btn-anterior').onclick = () => { desde = sumarDias(desde, -7); cargar(); };
    $('btn-siguiente').onclick = () => { desde = sumarDias(desde, 7); cargar(); };
    $('btn-hoy').onclick = () => { desde = new Date(); desde.setHours(0, 0, 0, 0); cargar(); };

    $('dias').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-ics]');
      if (!btn) return;
      Sesion.ocupado(btn, true);
      try {
        await CentroAPI.agenda.descargarIcs(btn.dataset.ics);
        Sesion.aviso('Abrí el archivo descargado para sumarlo a tu calendario');
      } catch (err) {
        Sesion.aviso(err.message, 'error');
      } finally { Sesion.ocupado(btn, false); }
    });

    // Si llegó desde una notificación, arranca en la semana del evento.
    if (eventoResaltado) {
      CentroAPI.agenda.obtener(eventoResaltado)
        .then((ev) => { desde = new Date(ev.inicio.slice(0, 10) + 'T00:00:00'); })
        .catch(() => {})
        .finally(cargar);
    } else {
      cargar();
    }
  })();
  </script>
</body>
</html>
