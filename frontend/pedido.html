<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedido · Centro Conectado</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    .historial { border-left: 3px solid var(--pared-2); margin: 0 0 0 8px; padding: 0 0 0 16px; list-style: none; }
    .historial li { position: relative; padding-bottom: 14px; }
    .historial li::before { content: ""; position: absolute; left: -24px; top: 6px; width: 13px; height: 13px; border-radius: 50%; background: var(--borde); }
  </style>
</head>
<body>
  <header class="encabezado">
    <div class="encabezado__fila">
      <a class="volver" href="pedidos.html" aria-label="Volver a pedidos">←</a>
      <div class="encabezado__texto">
        <h1 id="titulo">Pedido</h1>
        <p class="encabezado__sub" id="codigo"></p>
      </div>
      <a class="campana" href="notificaciones.html" aria-label="Notificaciones">🔔<span class="badge" id="badge-notif" hidden>0</span></a>
    </div>
  </header>

  <main>
    <div id="error" class="error-caja" role="alert" hidden></div>
    <section id="detalle"><p class="cargando">Cargando…</p></section>

    <form class="formulario" id="form-accion" hidden novalidate>
      <div class="campo">
        <label for="comentario">Comentario</label>
        <textarea id="comentario" name="comentario" maxlength="1000" placeholder="Opcional al tomar o resolver. Obligatorio para rechazar."></textarea>
        <p class="aviso-pacientes">⚠️ No escribas nombres ni DNI de pacientes.</p>
      </div>
      <p id="accion-error" class="mensaje-error" role="alert" hidden></p>
      <div class="tarjeta__acciones" id="botones"></div>
    </form>

    <h2>Historial</h2>
    <ol class="historial" id="historial"></ol>
  </main>

  <nav id="barra-inferior" aria-label="Navegación principal"></nav>

  <script src="js/api.js"></script>
  <script src="js/sesion.js"></script>
  <script>
  (function () {
    'use strict';
    Sesion.proteger();
    Sesion.pintarNavegacion('#barra-inferior', 'pedidos');
    Sesion.iniciarContadorNotificaciones('#badge-notif');
    const { esc, fmt } = Sesion;
    const $ = (id) => document.getElementById(id);
    const ESTADO = { PENDIENTE: 'Pendiente', EN_CURSO: 'En curso', RESUELTO: 'Resuelto', RECHAZADO: 'Rechazado', CANCELADO: 'Cancelado' };
    const PRIORIDAD = { ALTA: 'Alta (24 h)', MEDIA: 'Normal (72 h)', BAJA: 'Baja (7 días)' };
    const id = new URLSearchParams(location.search).get('id');
    if (!id) { location.replace('pedidos.html'); return; }

    function pintar(d) {
      const p = d.pedido;
      document.title = `${p.codigo} · Centro Conectado`;
      $('titulo').textContent = p.asunto;
      $('codigo').textContent = `${p.codigo} · ${p.tipo === 'INTERCONSULTA' ? 'Interconsulta' : 'Pedido'}`;
      const plazo = p.horasRestantes === null ? (p.cerradoEn ? `Cerrado el ${fmt.fechaHora(p.cerradoEn)}` : '')
        : p.vencido ? `⏰ Vencido hace ${Math.abs(p.horasRestantes)} h (plazo: ${fmt.fechaHora(p.plazo)})`
        : `Plazo: ${fmt.fechaHora(p.plazo)} (faltan ${p.horasRestantes} h)`;
      $('detalle').innerHTML = `
        <article class="tarjeta ${p.vencido ? 'tarjeta--vencida' : ''}">
          <span class="chip chip--${p.estado.toLowerCase()}">${ESTADO[p.estado]}</span>
          <span class="chip ${p.prioridad === 'ALTA' ? 'chip--alta' : ''}">Prioridad ${PRIORIDAD[p.prioridad]}</span>
          <p class="texto-largo">${esc(p.detalle)}</p>
          <p class="meta">De <strong>${esc(p.sectorOrigen.nombre)}</strong> (${esc(p.creadoPor)}) para <strong>${esc(p.sectorDestino.nombre)}</strong></p>
          ${p.asignadoA ? `<p class="meta">Asignado a ${esc(p.asignadoA)}</p>` : ''}
          <p class="meta">Creado el ${fmt.fechaHora(p.creadoEn)}</p>
          <p class="meta">${plazo}</p>
        </article>`;

      const abierto = p.estado === 'PENDIENTE' || p.estado === 'EN_CURSO';
      const botones = [];
      if (d.puedoCambiarEstado && p.estado === 'PENDIENTE') botones.push(['EN_CURSO', 'Tomar pedido', 'boton']);
      if (d.puedoCambiarEstado && abierto) botones.push(['RESUELTO', '✔ Resolver', 'boton']);
      if (d.puedoCambiarEstado && abierto) botones.push(['RECHAZADO', 'Rechazar', 'boton boton--peligro']);
      if (d.puedoCancelar && abierto) botones.push(['CANCELADO', 'Cancelar pedido', 'boton boton--peligro']);
      if (abierto) botones.push(['COMENTAR', 'Solo comentar', 'boton boton--secundario']);
      $('form-accion').hidden = !abierto;
      $('botones').innerHTML = botones.map(([estado, texto, clase]) =>
        `<button type="button" class="${clase}" data-estado="${estado}">${texto}</button>`).join('');

      $('historial').innerHTML = d.historial.length ? d.historial.map((m) => `
        <li>
          <strong>${m.estadoNuevo && m.estadoNuevo !== m.estadoAnterior ? ESTADO[m.estadoNuevo] : 'Comentario'}</strong>
          <span class="meta">· ${esc(m.usuario)} · ${fmt.fechaHora(m.creadoEn)}</span>
          ${m.comentario ? `<p class="texto-largo" style="margin:4px 0 0">${esc(m.comentario)}</p>` : ''}
        </li>`).join('') : '<li class="meta">Sin movimientos todavía.</li>';
    }

    $('botones').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-estado]');
      if (!btn) return;
      const form = $('form-accion');
      const estado = btn.dataset.estado;
      const comentario = $('comentario').value.trim();
      if ((estado === 'RECHAZADO' || estado === 'COMENTAR') && !comentario) {
        Sesion.mostrarError($('accion-error'), {
          message: estado === 'RECHAZADO' ? 'Para rechazar escribí el motivo' : 'Escribí el comentario',
          campos: { comentario: 'Este campo es obligatorio' },
        }, form);
        $('comentario').focus();
        return;
      }
      $('botones').querySelectorAll('button').forEach((b) => (b.disabled = true));
      Sesion.ocupado(btn, true);
      try {
        const d = estado === 'COMENTAR'
          ? await CentroAPI.pedidos.comentar(id, comentario)
          : await CentroAPI.pedidos.cambiarEstado(id, estado, comentario || null);
        form.reset();
        Sesion.mostrarError($('accion-error'), null, form);
        pintar(d);
        Sesion.aviso(estado === 'COMENTAR' ? 'Comentario agregado' : 'Pedido actualizado');
      } catch (err) {
        Sesion.mostrarError($('accion-error'), err, form);
        $('botones').querySelectorAll('button').forEach((b) => (b.disabled = false));
        Sesion.ocupado(btn, false);
      }
    });

    CentroAPI.pedidos.detalle(id).then(pintar).catch((err) => {
      $('detalle').innerHTML = '';
      $('error').hidden = false;
      $('error').textContent = err.message;
    });
  })();
  </script>
</body>
</html>
