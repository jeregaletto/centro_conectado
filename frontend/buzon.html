<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buzón · Centro Conectado</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    .codigo-grande { font-size: 30px; font-weight: 700; letter-spacing: .12em; background: var(--pared); border-radius: 10px; padding: 8px 14px; display: inline-block; margin: 6px 0; }
    .respuesta { background: #E3F4EF; border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  </style>
</head>
<body>
  <header class="encabezado">
    <div class="encabezado__fila">
      <div class="encabezado__texto">
        <h1>Buzón</h1>
        <p class="encabezado__sub">Consultas, sugerencias y reclamos. Te respondemos en 72 h.</p>
      </div>
      <a class="campana" href="notificaciones.html" aria-label="Notificaciones">🔔<span class="badge" id="badge-notif" hidden>0</span></a>
    </div>
  </header>

  <main>
    <section id="b-confirmacion" class="ok-caja" aria-live="polite" hidden></section>

    <form class="formulario" id="form-buzon" novalidate>
      <fieldset>
        <legend>¿Qué querés enviar?</legend>
        <div class="opciones">
          <label class="opcion"><input type="radio" name="tipo" value="CONSULTA" checked> Consulta</label>
          <label class="opcion"><input type="radio" name="tipo" value="SUGERENCIA"> Sugerencia</label>
          <label class="opcion"><input type="radio" name="tipo" value="RECLAMO"> Reclamo</label>
        </div>
      </fieldset>
      <div class="campo">
        <label for="b-asunto">Asunto</label>
        <input type="text" id="b-asunto" name="asunto" required maxlength="150">
      </div>
      <div class="campo">
        <label for="b-cuerpo">Mensaje</label>
        <textarea id="b-cuerpo" name="cuerpo" required maxlength="4000"></textarea>
      </div>
      <div class="campo">
        <label class="opcion"><input type="checkbox" id="b-anonimo" name="anonimo"> Enviar sin mi nombre (anónimo)</label>
        <p class="ayuda">Si es anónimo no se guarda quién lo mandó. Vas a recibir un código para ver la respuesta.</p>
      </div>
      <p id="b-error" class="mensaje-error" role="alert" hidden></p>
      <button class="boton boton--ancho" type="submit">Enviar</button>
    </form>

    <h2>Mis mensajes</h2>
    <ul class="lista" id="b-mios" aria-live="polite"><li class="cargando">Cargando…</li></ul>

    <details class="plegable">
      <summary>🔎 Tengo un código de seguimiento</summary>
      <form class="formulario" id="form-codigo" novalidate>
        <div class="campo">
          <label for="codigo">Código</label>
          <input type="text" id="codigo" name="codigo" required autocomplete="off" style="text-transform:uppercase">
        </div>
        <p id="codigo-error" class="mensaje-error" role="alert" hidden></p>
        <button class="boton" type="submit">Buscar</button>
        <div id="codigo-resultado"></div>
      </form>
    </details>
  </main>

  <nav id="barra-inferior" aria-label="Navegación principal"></nav>

  <script src="js/api.js"></script>
  <script src="js/sesion.js"></script>
  <script>
  (function () {
    'use strict';
    const params = new URLSearchParams(location.search);
    // Notificaciones de gestión (buzon.html?gestion=...) → pantalla de Gestión.
    if (params.get('gestion')) { location.replace('gestion.html?seccion=buzon'); return; }

    Sesion.proteger();
    Sesion.pintarNavegacion('#barra-inferior', 'buzon');
    Sesion.iniciarContadorNotificaciones('#badge-notif');
    const { esc, fmt } = Sesion;
    const $ = (id) => document.getElementById(id);
    const CLAVE = 'cc.buzon.codigos';
    const codigosAnonimos = () => { try { return JSON.parse(localStorage.getItem(CLAVE) || '[]'); } catch { return []; } };
    const ESTADO = { RECIBIDO: 'Recibido', EN_REVISION: 'En revisión', RESPONDIDO: 'Respondido', CERRADO: 'Cerrado' };
    const TIPO = { CONSULTA: 'Consulta', SUGERENCIA: 'Sugerencia', RECLAMO: 'Reclamo' };

    const item = (m) => `
      <li class="tarjeta ${m.vencido && !m.respuesta ? 'tarjeta--vencida' : ''}">
        <span class="chip chip--${m.estado.toLowerCase()}">${ESTADO[m.estado]}</span>
        <span class="chip">${TIPO[m.tipo]}</span>
        ${m.anonimo ? '<span class="chip">Anónimo</span>' : ''}
        <h3>${esc(m.asunto)}</h3>
        <p class="meta">Enviado el ${fmt.fechaHora(m.creadoEn)}${m.anonimo ? ' · Código ' + esc(m.codigoSeguimiento) : ''}</p>
        ${m.respuesta
          ? `<div class="respuesta"><strong>Respuesta</strong>${m.respondidoEn ? ' · ' + fmt.fecha(m.respondidoEn) : ''}<p class="texto-largo" style="margin:4px 0 0">${esc(m.respuesta)}</p></div>`
          : `<p class="meta">${m.vencido ? 'Fuera de plazo: ya se avisó a Dirección' : 'Respuesta antes del ' + fmt.fechaHora(m.plazoRespuesta)}</p>`}
      </li>`;

    async function cargarMios() {
      try {
        const conNombre = await CentroAPI.buzon.mios();
        // Los anónimos no están vinculados a tu usuario: se consultan con el código guardado en este dispositivo.
        const anonimos = await Promise.all(codigosAnonimos().map((c) => CentroAPI.buzon.seguimiento(c).catch(() => null)));
        const todos = conNombre.concat(anonimos.filter(Boolean)).sort((a, b) => b.creadoEn.localeCompare(a.creadoEn));
        $('b-mios').innerHTML = todos.length ? todos.map(item).join('')
          : '<li class="vacio">Todavía no enviaste mensajes.</li>';
      } catch (err) {
        $('b-mios').innerHTML = `<li class="error-caja" role="alert">${esc(err.message)}</li>`;
      }
    }

    $('form-buzon').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('[type=submit]');
      Sesion.ocupado(btn, true);
      try {
        const m = await CentroAPI.buzon.enviar({
          tipo: form.querySelector('input[name=tipo]:checked').value,
          asunto: $('b-asunto').value.trim(),
          cuerpo: $('b-cuerpo').value.trim(),
          anonimo: $('b-anonimo').checked,
        });
        if (m.anonimo) localStorage.setItem(CLAVE, JSON.stringify([m.codigoSeguimiento, ...codigosAnonimos()]));
        const conf = $('b-confirmacion');
        conf.hidden = false;
        conf.innerHTML = `<h2 style="margin-top:0">✔ Enviado</h2>
          <p>Te respondemos antes del ${fmt.fechaLarga(m.plazoRespuesta)}.</p>
          ${m.anonimo ? `<p>Tu código de seguimiento es<br><span class="codigo-grande">${esc(m.codigoSeguimiento)}</span><br>
            Anotalo: es la única forma de ver la respuesta desde otro dispositivo.</p>` : ''}`;
        conf.scrollIntoView({ block: 'start' });
        form.reset();
        Sesion.mostrarError($('b-error'), null, form);
        cargarMios();
      } catch (err) {
        Sesion.mostrarError($('b-error'), err, form);
      } finally { Sesion.ocupado(btn, false); }
    });

    async function buscarCodigo(codigo) {
      const btn = $('form-codigo').querySelector('[type=submit]');
      Sesion.ocupado(btn, true);
      $('codigo-resultado').innerHTML = '';
      try {
        const m = await CentroAPI.buzon.seguimiento(codigo.trim().toUpperCase());
        Sesion.mostrarError($('codigo-error'), null);
        $('codigo-resultado').innerHTML = `<ul class="lista" style="margin-top:14px">${item(m)}</ul>`;
      } catch (err) {
        Sesion.mostrarError($('codigo-error'), err);
      } finally { Sesion.ocupado(btn, false); }
    }

    $('form-codigo').addEventListener('submit', (e) => {
      e.preventDefault();
      if ($('codigo').value.trim()) buscarCodigo($('codigo').value);
    });

    // Notificación "Tu mensaje fue respondido" → buzon.html?codigo=XXXX
    if (params.get('codigo')) {
      $('codigo').value = params.get('codigo');
      $('codigo').closest('details').open = true;
      buscarCodigo(params.get('codigo'));
    }

    cargarMios();
  })();
  </script>
</body>
</html>
