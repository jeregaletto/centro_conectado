<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio · Centro Conectado</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="encabezado">
    <div class="encabezado__fila">
      <div class="encabezado__texto">
        <p class="encabezado__sub" id="saludo">Hola</p>
        <h1 id="nombre">Cargando…</h1>
        <p class="encabezado__sub" id="rol"></p>
      </div>
      <a class="campana" href="notificaciones.html" aria-label="Notificaciones">🔔<span class="badge" id="badge-notif" hidden>0</span></a>
    </div>
  </header>

  <main>
    <div id="error" class="error-caja" role="alert" hidden></div>

    <!-- Avance de Mi puesto: en vista simple es lo primero que se ve -->
    <a class="avance" id="avance" href="mi-puesto.html" hidden style="display:block;text-decoration:none">
      <p class="avance__texto" id="avance-texto"></p>
      <div class="avance__barra"><div class="avance__relleno" id="avance-barra"></div></div>
      <p class="meta">Tocá para ir a Mi puesto</p>
    </a>

    <a class="tarjeta tarjeta--destacada" id="pedidos-pendientes" href="pedidos.html" hidden></a>

    <h2>Importante</h2>
    <div id="fijados" aria-live="polite"><p class="cargando">Cargando…</p></div>

    <h2>Agenda de hoy</h2>
    <div id="agenda"><p class="cargando">Cargando…</p></div>
    <p class="vista-completa"><a href="agenda.html">Ver toda la agenda</a></p>

    <h2>Novedades</h2>
    <div id="novedades"><p class="cargando">Cargando…</p></div>
  </main>

  <nav id="barra-inferior" aria-label="Navegación principal"></nav>

  <script src="js/api.js"></script>
  <script src="js/sesion.js"></script>
  <script>
  (function () {
    'use strict';
    const usuario = Sesion.proteger();
    Sesion.pintarNavegacion('#barra-inferior', 'inicio');
    Sesion.iniciarContadorNotificaciones('#badge-notif');
    const { esc, fmt } = Sesion;
    const $ = (id) => document.getElementById(id);
    const simple = usuario.vista === 'SIMPLE';
    const TIPO = { NOVEDAD: 'Novedad', CAMBIO_HORARIO: 'Cambio de horario', URGENTE: 'Urgente' };
    const avisoResaltado = new URLSearchParams(location.search).get('aviso');

    if (simple) document.querySelectorAll('.vista-completa').forEach((n) => (n.hidden = true));

    function pintarAviso(a) {
      const pendiente = a.requiereLectura && !a.leido;
      return `
        <article class="tarjeta tarjeta--${a.tipo.toLowerCase()} ${a.leido ? 'tarjeta--leida' : ''}" id="aviso-${a.id}">
          <span class="chip chip--${a.tipo.toLowerCase()}">${TIPO[a.tipo]}</span>
          ${a.fijado ? '<span class="chip">📌 Fijado</span>' : ''}
          <h3>${esc(a.titulo)}</h3>
          <p class="texto-largo">${esc(a.cuerpo)}</p>
          <p class="meta">${esc(a.autor)} · ${fmt.fecha(a.publicadoEn)}${a.sectores.length ? ' · Para ' + esc(a.sectores.join(', ')) : ''}</p>
          ${pendiente
            ? `<div class="tarjeta__acciones"><button class="boton" type="button" data-leido="${a.id}">✔ Marcar como leído</button></div>`
            : a.requiereLectura ? '<p class="meta">✔ Leído</p>' : ''}
        </article>`;
    }

    function pintarEvento(e) {
      return `<a class="tarjeta" href="agenda.html?evento=${e.id}">
          <h3>${fmt.hora(e.inicio)} · ${esc(e.titulo)}</h3>
          ${e.lugar ? `<p class="meta">📍 ${esc(e.lugar)}</p>` : ''}
        </a>`;
    }

    async function cargar() {
      try {
        const d = await CentroAPI.inicio.obtener();
        $('saludo').textContent = `${d.saludo} · ${fmt.fechaLarga(d.fecha)}`;
        $('nombre').textContent = d.nombre;
        $('rol').textContent = `${d.rolEtiqueta} · ${usuario.sector ? usuario.sector.nombre : ''}`;

        if (d.tareasHoy && d.tareasHoy.total > 0) {
          $('avance').hidden = false;
          $('avance-texto').textContent = d.tareasHoy.hechas === d.tareasHoy.total
            ? `¡Listo! Hiciste las ${d.tareasHoy.total} tareas de hoy`
            : `Hiciste ${d.tareasHoy.hechas} de ${d.tareasHoy.total} tareas`;
          $('avance-barra').style.width = d.tareasHoy.porcentaje + '%';
        }

        if (d.pedidosPendientes > 0) {
          const p = $('pedidos-pendientes');
          p.hidden = false;
          p.innerHTML = `<h3>🔁 ${d.pedidosPendientes} ${d.pedidosPendientes === 1 ? 'pedido pendiente' : 'pedidos pendientes'} para tu área</h3><p class="meta">Tocá para verlos</p>`;
        }

        $('fijados').innerHTML = d.fijados.length
          ? d.fijados.map(pintarAviso).join('')
          : '<p class="vacio">No hay avisos importantes. Todo al día.</p>';

        $('agenda').innerHTML = d.agendaHoy.length
          ? d.agendaHoy.map(pintarEvento).join('')
          : '<p class="vacio">Hoy no hay eventos.</p>';

        $('novedades').innerHTML = d.novedades.length
          ? d.novedades.map(pintarAviso).join('')
          : '<p class="vacio">Sin novedades esta semana.</p>';

        if (avisoResaltado) {
          const el = $('aviso-' + avisoResaltado);
          if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('tarjeta--destacada'); }
        }
      } catch (err) {
        $('error').hidden = false;
        $('error').textContent = err.message;
        ['fijados', 'agenda', 'novedades'].forEach((id) => ($(id).innerHTML = ''));
      }
    }

    document.querySelector('main').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-leido]');
      if (!btn) return;
      Sesion.ocupado(btn, true);
      try {
        const actualizado = await CentroAPI.avisos.marcarLeido(btn.dataset.leido);
        btn.closest('article').outerHTML = pintarAviso(actualizado);
        Sesion.aviso('Listo, quedó como leído');
      } catch (err) {
        Sesion.ocupado(btn, false);
        Sesion.aviso(err.message, 'error');
      }
    });

    cargar();
  })();
  </script>
</body>
</html>
