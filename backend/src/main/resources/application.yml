spring:
  application:
    name: centro-conectado-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      # Flyway es dueño del esquema (db/migration). Hibernate no crea ni modifica tablas.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: America/Argentina/Buenos_Aires
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Argentina/Buenos_Aires
    default-property-inclusion: always

server:
  port: ${PORT:8080}
  error:
    include-message: always

app:
  zona-horaria: America/Argentina/Buenos_Aires
  seed: ${APP_SEED:true}
  jwt:
    # SOLO DESARROLLO. En producción definí JWT_SECRET (base64, mínimo 32 bytes).
    secret: ${JWT_SECRET:Y2FtYmlhLWVzdGUtc2VjcmV0by1lbi1wcm9kdWNjaW9uLWNlbnRyby1jb25lY3RhZG8tMjAyNg==}
    expiracion-horas: 12
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173}
  buzon:
    plazo-respuesta-horas: 72
  contenido:
    vigencia-por-defecto-dias: 30
    vigencia-maxima-dias: 180
    aviso-vencimiento-dias: 3
  login:
    max-intentos: 5
    bloqueo-minutos: 10

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/centro;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/centro_conectado}
    username: ${DB_USER:centro}
    password: ${DB_PASSWORD:centro_dev_2026}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:centro_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
app:
  seed: true
